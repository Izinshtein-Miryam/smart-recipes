<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מתכונים חכם – אב-טיפוס מסכים</title>
<style>
:root{
  --bg:#faf7f2;--surface:#ffffff;--ink:#2b2622;--muted:#7a6f66;--line:#e8e1d8;
  --brand:#c2562b;--brand-ink:#ffffff;--brand-soft:#f6e6da;
  --meat:#b23a3a;--meat-soft:#f7e1e1;--dairy:#2f6db5;--dairy-soft:#e2ecf8;--parve:#3c8a4f;--parve-soft:#e2f2e6;
  --ai:#6d47b8;--ai-soft:#eee7fa;--ok:#2f8a4f;--warn:#b7791f;--warn-soft:#fbf1dc;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Heebo","Assistant","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.9rem}h2{font-size:1.4rem}h3{font-size:1.1rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}h1{font-size:1.5rem}}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-weight:800;font-size:1.2rem;color:var(--brand);display:flex;align-items:center;gap:8px;white-space:nowrap}
nav.main{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.main a{padding:6px 12px;border-radius:999px;white-space:nowrap;font-size:.95rem;color:var(--muted)}
nav.main a:hover{background:var(--brand-soft);color:var(--ink)}
nav.main a.active{background:var(--brand);color:var(--brand-ink)}
.role{font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface)}
.btn.menu-btn{display:none}
@media (max-width:900px){
  nav.main{position:absolute;top:64px;right:0;left:0;background:var(--surface);flex-direction:column;padding:8px 16px;border-bottom:1px solid var(--line);display:none}
  nav.main.open{display:flex}
  .btn.menu-btn{display:inline-flex}
}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:.875rem;border-radius:8px}
.btn.danger{color:var(--meat)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
label.f{display:block;font-size:.875rem;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.section{margin:28px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;border:1px solid var(--line);background:var(--surface)}
.chip.x button{border:0;background:none;cursor:pointer;padding:0;color:var(--muted);font-size:1rem;line-height:1}
.chip.ai{background:var(--ai-soft);border-color:#d9cbf3;color:var(--ai)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
.k-meat{background:var(--meat-soft);color:var(--meat)}
.k-dairy{background:var(--dairy-soft);color:var(--dairy)}
.k-parve{background:var(--parve-soft);color:var(--parve)}
.b-ai{background:var(--ai-soft);color:var(--ai)}
.b-draft{background:var(--warn-soft);color:var(--warn)}
.b-pub{background:var(--parve-soft);color:var(--parve)}
.b-hidden{background:#eee;color:#666}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a,.tabs button{padding:10px 16px;border:0;background:none;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
.tabs .on{border-bottom-color:var(--brand);color:var(--ink);font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
table.t th{color:var(--muted);font-weight:600;background:#fcfaf7}
.table-wrap{overflow-x:auto}
.note{background:var(--warn-soft);border:1px solid #f0dcb1;border-radius:10px;padding:10px 14px;font-size:.9rem}
.note.ai{background:var(--ai-soft);border-color:#d9cbf3}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

/* recipe art */
.art{position:relative;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3}
.art svg{width:46%;height:auto;opacity:.92}
.art.wide{aspect-ratio:16/9}
.art img{width:100%;height:100%;object-fit:cover}
.rcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.15s}
.rcard:hover{transform:translateY(-2px);border-color:var(--brand)}
.rcard .art{border-radius:0}
.rcard .b{padding:12px 14px}
.rcard h3{font-size:1rem;margin:6px 0 4px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}

/* search */
.search{position:relative}
.search .input{padding:14px 16px;font-size:1.05rem;border-radius:14px;padding-left:120px}
.search .go{position:absolute;left:6px;top:6px;bottom:6px}
.ac-list{position:absolute;top:100%;right:0;left:0;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30;overflow:hidden}
.ac-list a{display:flex;justify-content:space-between;padding:9px 14px;font-size:.95rem}
.ac-list a:hover{background:var(--brand-soft)}
.hero{background:linear-gradient(135deg,#fbeee3,#f5e2d3);border-radius:20px;padding:36px 28px;margin-top:24px}
.hero h1{font-size:2rem}

/* layout */
.layout-side{display:grid;grid-template-columns:240px 1fr;gap:24px}
@media (max-width:820px){.layout-side{grid-template-columns:1fr}}
.recipe-head{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){.recipe-head{grid-template-columns:1fr}}
.recipe-body{display:grid;grid-template-columns:1fr 1.6fr;gap:28px}
@media (max-width:820px){.recipe-body{grid-template-columns:1fr}}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.stepper span{min-width:36px;text-align:center;font-weight:700}
ol.steps{padding:0;margin:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
ol.steps li::before{content:counter(s);flex:0 0 30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700}
ul.ings{list-style:none;padding:0;margin:0}
ul.ings li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
ul.ings .q{font-weight:600;white-space:nowrap}

/* cook mode */
.cook{position:fixed;inset:0;background:#1f1b18;color:#fbf6f0;z-index:50;display:flex;flex-direction:column}
.cook .top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #3a332d}
.cook .main{flex:1;display:grid;grid-template-columns:1.6fr 1fr;gap:24px;padding:28px;overflow:auto}
@media (max-width:820px){.cook .main{grid-template-columns:1fr}}
.cook .stext{font-size:clamp(1.4rem,3.2vw,2.3rem);line-height:1.45}
.cook .panel{background:#2b2622;border-radius:16px;padding:18px}
.cook .timer{font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.cook .bottom{display:flex;gap:12px;padding:16px 20px;border-top:1px solid #3a332d}
.cook .btn{background:#3a332d;border-color:#3a332d;color:#fbf6f0}
.cook .btn.primary{background:var(--brand);border-color:var(--brand)}
.progress{height:6px;background:#3a332d;border-radius:99px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--brand)}

/* generate */
.ing-box{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--surface);position:relative}
.ing-box input{border:0;outline:0;flex:1;min-width:140px;padding:4px}
.stream{font-family:ui-monospace,Consolas,monospace;font-size:.88rem;background:#1f1b18;color:#e9e1d8;border-radius:12px;padding:14px;min-height:120px;white-space:pre-wrap}
.added{font-size:.72rem;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:0 6px;margin-inline-start:6px}

/* chat */
.fab{position:fixed;left:20px;bottom:20px;z-index:40;border-radius:999px;padding:14px 20px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.chat{position:fixed;left:20px;bottom:86px;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 120px));z-index:41;display:none;flex-direction:column;overflow:hidden}
.chat.open{display:flex}
.chat .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.chat .msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fcfaf7}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:.93rem}
.msg.me{align-self:flex-start;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .mini{display:flex;gap:8px;align-items:center;margin-top:8px;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff}
.msg .mini .art{width:52px;aspect-ratio:1;border-radius:8px;flex:0 0 52px}
.msg .mini .art svg{width:70%}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}

/* misc */
.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:#2b2622;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.kpi{padding:16px}
.kpi b{display:block;font-size:1.6rem}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}
.bar .l{width:110px;font-size:.9rem}
.bar .tr{flex:1;background:#f1ece5;border-radius:6px;height:22px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--brand)}
.check-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check-item.done span.n{text-decoration:line-through;color:var(--muted)}
.screen-map a{display:block}
.screen-map .card:hover{border-color:var(--brand)}
.imgcompare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgbox{border:1px dashed var(--line);border-radius:12px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fcfaf7;color:var(--muted);font-size:.9rem;text-align:center;padding:6px}
.imgbox img{width:100%;height:100%;object-fit:cover}
.enhanced{filter:brightness(1.12) contrast(1.15) saturate(1.25)}
.lock{font-size:.82rem;background:#f4f1ec;border-radius:8px;padding:8px 10px;color:var(--muted)}
footer.ft{margin:48px 0 90px;color:var(--muted);font-size:.85rem;text-align:center}
@media print{
  header.top,.fab,.chat,.no-print,footer.ft,.sim{display:none !important}
  body{background:#fff}
  .card{box-shadow:none}
  .recipe-head{grid-template-columns:1fr 1fr}
  .recipe-body{grid-template-columns:1fr 1.6fr}
}
</style>
</head>

function parseQuery(text){
  const t=' '+text+' ',p={};
  if(/בשרי/.test(t))p.k='meat';else if(/חלבי/.test(t))p.k='dairy';else if(/פרוו?ה|טבעוני/.test(t))p.k='parve';
  const m=t.match(/(\d+)\s*דק/);if(m)p.t=m[1];else if(/חצי שעה|מהיר|קל להכנה/.test(t))p.t='30';else if(/ שעה /.test(t))p.t='60';
  if(/קינוח|מתוק/.test(t))p.d='קינוח';else if(/מאפה|עוגה/.test(t))p.d='מאפה';else if(/תוספת|סלט/.test(t))p.d='תוספת';else if(/ראשונה|מרק/.test(t))p.d='ראשונה';else if(/עיקרית|ארוחת ערב/.test(t))p.d='עיקרית';
  if(/(ללא|בלי) גלוטן/.test(t))p.g='ללא גלוטן';
  const stop=/^(מנה|מנות|משהו|עם|של|לערב|לבוקר|בערב|בבוקר|מהירה?|קלה?|בשרי|חלבי|פרווה|פרוה|טבעוני|דקות?|ללא|בלי|גלוטן|חצי|שעה|ל?ארבעה|רוצה|בא|לי|מתכון|\d+)$/;
  const words=text.split(/\s+/).filter(w=>w.length>1&&!stop.test(w));
  const w=words.filter(x=>R.some(r=>r.title.includes(x)||r.ings.some(i=>i[0].includes(x))));
  if(w.length)p.w=w.join(',');
  return p;
}
function filterR(p){
  return pub().filter(r=>(!p.k||r.k===p.k)&&(!p.t||r.prep+r.cook<=+p.t)&&(!p.d||r.dish===p.d)&&(!p.g||r.diet.includes(p.g))
   &&(!p.w||p.w.split(',').every(x=>r.title.includes(x)||r.ings.some(i=>i[0].includes(x)))));
}

      <div class="progress"><i style="width:${(c.i+1)/r.steps.length*100}%"></i></div>
      <span class="small" id="wl">מסך פעיל</span>

      <div class="grid" style="align-content:start">

V.generate=(q)=>{
  const g=S.gen;
  if(q.get('mode')&&!g._from){g.mode=q.get('mode');g._from=1}
  if(q.get('text'))g.text=q.get('text');
  if(q.get('r'))g.r=q.get('r');
  const quota=S.role==='guest'?S.settings.qGuest:S.settings.qUser;
  const tab=(m,l)=>`<button class="${g.mode===m?'on':''}" data-act="gmode" data-m="${m}">${l}</button>`;
  let form='';
  if(g.mode==='ingredients')form=`
    <div class="field"><label class="f">מה יש לכם במטבח?</label>
      <div class="ing-box">${g.ings.map((x,i)=>`<span class="chip x">${esc(x)}<button type="button" data-act="ing-rm" data-i="${i}">×</button></span>`).join('')}
      <input id="ingin" list="inglist" placeholder="הקלידו רכיב ולחצו Enter"></div>
      <datalist id="inglist">${Object.keys(ING).map(x=>`<option value="${x}">`).join('')}</datalist></div>
    <div class="grid g2"><div class="field"><label class="f">מספר מנות</label><input class="input" type="number" id="gserv" value="4" min="1"></div>
    <div class="field"><label class="f">סוג</label><select class="input" id="gk"><option value="">לפי הרכיבים</option>${Object.entries(K).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div></div>
    <div class="lock">ה-AI רשאי להוסיף רק רכיבי בסיס: ${BASIC.join(', ')}. כל תוספת תסומן.</div>`;
  else if(g.mode==='free')form=`
    <div class="field"><label class="f">תארו מה אתם רוצים</label><textarea class="input" id="gtext" rows="4" placeholder="למשל: מנה קלה לארבעה בחצי שעה">${esc(g.text||'')}</textarea></div>`;
  else form=`
    <div class="field"><label class="f">מתכון בסיס</label><select class="input" id="gr">${pub().map(r=>`<option value="${r.slug}" ${g.r===r.slug?'selected':''}>${esc(r.title)}</option>`).join('')}</select></div>
    <div class="field"><label class="f">מה לשנות?</label><input class="input" id="greq" placeholder="למשל: ללא גלוטן / לקצר את זמן הבישול / להחליף רכיב"></div>`;
  return `
  <div class="section"><h1>יצירה חכמה</h1><p class="muted">ה-AI יוצר מתכון מלא אחד בכל פעם. לא מתאים? לחצו „נסה שוב”.</p></div>
  <div class="grid" style="grid-template-columns:1fr 1.2fr;align-items:start" id="gengrid">
    <div class="card pad">
      <div class="tabs">${tab('ingredients','מהרכיבים שלי')}${tab('free','מתיאור חופשי')}${tab('adapt','התאמת מתכון')}</div>
      ${form}
      <div class="row" style="margin-top:16px"><button class="btn ai" data-act="gen">צור מתכון</button><span class="small muted">נותרו ${Math.max(quota-S.used,0)} מתוך ${quota} יצירות היום</span></div>
    </div>
    <div id="genout">${g.result?resultCard(g.result):`<div class="card pad empty">התוצאה תופיע כאן</div>`}</div>
  </div><style>@media(max-width:900px){#gengrid{grid-template-columns:1fr!important}}</style>`;
};
function mockGen(){
  const g=S.gen,v=g.variant;let title,ings=[],steps,k='parve',changes=[],warn='',serv=4,time=30;
  if(g.mode==='ingredients'){
    let list=g.ings.length?[...g.ings]:['ביצים','תרד'];
    const hasM=list.some(x=>(ING[x]||[])[1]==='meat'),hasD=list.some(x=>(ING[x]||[])[1]==='dairy');
    if(hasM&&hasD){warn='זוהה ערבוב בשר וחלב ברכיבים. המתכון נוצר מחדש בלי מוצרי החלב.';list=list.filter(x=>(ING[x]||[])[1]!=='dairy')}
    k=list.some(x=>(ING[x]||[])[1]==='meat')?'meat':list.some(x=>(ING[x]||[])[1]==='dairy')?'dairy':'parve';
    const [a,b]=[list[0],list[1]||'ירקות'];
    title=[`מחבת ${a} ו${b} בתיבול ביתי`,`תבשיל ${a} עם ${b}`,`${a} אפוי עם ${b} ועשבי תיבול`][v%3];
    const am=[[300,'גרם'],[2,"יח'"],[1,'כוס'],[150,'גרם']];
    ings=list.map((x,i)=>[x,am[i%4][0],am[i%4][1],false]).concat([['שמן זית',2,'כפות',true],['מלח',1,'כפית',true],['פלפל שחור',0.5,'כפית',true]]);
    steps=[`חותכים את ה${list.join(', ')} לחתיכות אחידות.`,`מחממים שמן זית במחבת רחבה ומוסיפים את ה${a}.`,`מוסיפים את שאר הרכיבים, מתבלים במלח ופלפל ומבשלים 15 דקות.`,'טועמים, מתקנים תיבול ומגישים.'];
    serv=+($('#gserv')?.value||4);
  }else if(g.mode==='free'){
    const t=$('#gtext')?.value||g.text||'';g.text=t;
    title=['קערת אורז וירקות מוקפצים','פסטה ברוטב ירקות קלויים','תבשיל עדשים וירקות מהיר'][v%3];
    ings=[['אורז',1.5,'כוסות',false],['קישוא',1,"יח'",false],['גזר',2,"יח'",false],['בצל',1,"יח'",false],['שום',2,'שיניים',false],['שמן זית',2,'כפות',false],['מלח',1,'כפית',false]];
    steps=['מבשלים את הבסיס לפי ההוראות.','מקפיצים את הירקות במחבת חמה.','מאחדים, מתבלים ומגישים.'];
    if(/(\d+)\s*דק|חצי שעה/.test(t))time=30;
    const m=t.match(/ל?(שניים|שלושה|ארבעה|חמישה|שישה)/);if(m)serv={שניים:2,שלושה:3,ארבעה:4,חמישה:5,שישה:6}[m[1]];
  }else{
    const r=bySlug($('#gr')?.value||g.r||'pashtidat-tered'),req=$('#greq')?.value||'';
    k=r.k;title=`${r.title} – גרסה מותאמת`;serv=r.serv;time=r.prep+r.cook;
    ings=r.ings.map(i=>[...i,false]);steps=r.steps.map(s=>s[0]);
    const fi=ings.findIndex(i=>i[0]==='קמח'||i[0]==='פירורי לחם');
    if(/גלוטן/.test(req)&&fi>-1){changes.push(`הוחלף: ${ings[fi][0]} ← קמח אורז`);ings[fi]=['קמח אורז',ings[fi][1],ings[fi][2],'changed']}
    else if(/זמן|מהיר|לקצר/.test(req)){time=Math.max(15,time-15);changes.push('זמן הבישול קוצר ב-15 דקות (אש גבוהה יותר וחיתוך דק יותר)')}
    else changes.push(`בוצעה התאמה לפי הבקשה: „${req||'ללא בקשה ספציפית'}”`);
  }
  return {title,k,serv,time,ings,steps,changes,warn,mode:g.mode};
}

  if(tab==='audit')body=`<div class="card table-wrap"><table class="t"><thead><tr><th>זמן</th><th>משתמש</th><th>פעולה</th><th>ישות</th><th>פרטים</th></tr></thead><tbody>
    ${[['03/11 10:42','foo@example.com','ai.generate','recipe','mode=ingredients · 1,840 tokens · 6.2s'],['03/11 10:31','baz@example.com','recipe.publish','סלט קינואה וירקות','status: draft → published'],['03/11 10:30','baz@example.com','image.ai_edit','סלט קינואה וירקות','Gemini · אושר'],['03/11 09:58','admin@example.com','user.create','baz@example.com','role=content_manager'],['03/11 09:12','guest:10.0.0.4','ai.search','—','"מנה פרווה מהירה" · 0.9s'],['02/11 22:05','admin@example.com','settings.update','quota','qUser: 15 → 20']].map(a=>`<tr>${a.map((c,i)=>`<td>${i===2?`<code>${c}</code>`:esc(c)}</td>`).join('')}</tr>`).join('')}

   ['#/recipe/shakshuka-yeruka','עמוד מתכון','מנות, מועדפים, קניות, הדפסה, שיתוף ודומים'],['#/cook/shakshuka-yeruka','מצב בישול','שלב אחר שלב, טיימרים ומסך פעיל'],['#/generate','יצירה חכמה','שלושה מצבים, streaming ותוצאה'],
   ['#/shopping','רשימת קניות','רשימה מאוחדת לפי קטגוריות'],['#/favorites','מועדפים',''],['#/login','התחברות / הרשמה',''],
   ['#/admin','ניהול מתכונים','מנהל תוכן'],['#/admin/edit/salat-kinoa','עריכת מתכון','כולל עיבוד ויצירת תמונה'],['#/system/users','מנהל מערכת – משתמשים','יצירת מנהלי תוכן'],

/* ===================== ניתוב ===================== */
function nav(){
  const items=[['home','בית'],['search','חיפוש'],['generate','יצירה חכמה'],['shopping','רשימת קניות'],['favorites','מועדפים']];
  if(isStaff())items.push(['admin','ניהול תוכן']);
  if(S.role==='sysadmin')items.push(['system','מנהל מערכת']);
  if(!isUser())items.push(['login','התחברות']);
  items.push(['screens','מפת מסכים']);
  const cur=(location.hash.slice(2).split(/[/?]/)[0])||'home';
  $('#nav').innerHTML=items.map(([k,l])=>`<a href="#/${k}" class="${cur===k?'active':''}">${l}</a>`).join('');
}
let timerIv=null,wakeLock=null;
function render(){
  const h=decodeURIComponent(location.hash.slice(1))||'/home';
  const [path,qs]=h.split('?');const p=path.split('/').filter(Boolean);const q=new URLSearchParams(qs||'');
  if(p[0]!=='cook'){clearInterval(timerIv);timerIv=null;if(S.cook)S.cook.run=false;if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}}
  let html;
  switch(p[0]){
    case 'home':case undefined:html=V.home();break;
    case 'search':html=V.search(q);break;
    case 'recipe':html=V.recipe(p[1]);break;
    case 'cook':html=V.cook(p[1]);break;
    case 'generate':html=V.generate(q);break;
    case 'shopping':html=V.shopping();break;
    case 'favorites':html=V.favorites();break;
    case 'login':html=V.login(q);break;
    case 'admin':html=p[1]==='edit'?V.adminEdit(p[2]):V.admin();break;
    case 'system':html=V.system(p[1]);break;
    case 'screens':html=V.screens();break;
    default:html=V.notfound();
  }
  $('#app').innerHTML=html;nav();$('#nav').classList.remove('open');
  after(p);
}
function after(p){
  if(p[0]==='cook'&&'wakeLock' in navigator&&!wakeLock){navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{const e=$('#wl');if(e)e.textContent=''})}
  if(p[0]==='cook'){let x0=null;const el=$('#swipe');el.addEventListener('touchstart',e=>x0=e.touches[0].clientX);el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60)step(dx>0?1:-1);x0=null})}
  if(p[0]==='admin'&&!p[1]){$('#admq').addEventListener('input',e=>{document.querySelectorAll('#admt tbody tr').forEach(tr=>tr.hidden=!tr.dataset.title.includes(e.target.value))})}
  if(p[0]==='admin'&&p[1]==='edit'){$('#imgfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$('#orig').innerHTML=`<img src="${rd.result}" alt="תמונה מקורית">`;$('#orig').dataset.src=rd.result};rd.readAsDataURL(f)})}
  if(p[0]==='system'&&p[1]==='settings')wsum();
  if(p[0]==='generate'){const i=$('#ingin');if(i)i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=i.value.trim();if(v&&!S.gen.ings.includes(v)){S.gen.ings.push(v);render();$('#ingin').focus()}}})}
  window.scrollTo(0,0);
}
function wsum(){const f=document.querySelector('[data-form=settings]');const s=['wSim','wTime','wPop'].reduce((a,k)=>a+ +f[k].value,0);$('#wsum').innerHTML=Math.abs(s-1)<0.001?'<span style="color:var(--ok)">סכום המשקלות: 1.0</span>':`<span style="color:var(--meat)">סכום המשקלות ${s.toFixed(2)} – צריך להיות 1.0</span>`}
function step(d){const r=bySlug(S.cook.slug);const i=Math.min(Math.max(S.cook.i+d,0),r.steps.length-1);clearInterval(timerIv);timerIv=null;S.cook={slug:r.slug,i,left:r.steps[i][1],run:false};render()}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,0.35,0.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.2;o.start(a.currentTime+t);o.stop(a.currentTime+t+.2)})}catch(e){}}

/* ===================== אירועים ===================== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(['set-filter','w','shop-check'].includes(act))return;
  const hashQ=()=>new URLSearchParams((location.hash.split('?')[1])||'');
  switch(act){
    case 'menu':$('#nav').classList.toggle('open');break;
    case 'rm-filter':{const q=hashQ();q.delete(a.dataset.k);q.set('x','1');location.hash='#/search?'+q.toString();break}
    case 'fav':{const s=a.dataset.s;S.fav.has(s)?S.fav.delete(s):S.fav.add(s);toast(S.fav.has(s)?'נוסף למועדפים':'הוסר מהמועדפים');render();break}
    case 'to-shop':{const r=bySlug(a.dataset.s);addToShop(r,S.servings[r.slug]);toast('הרכיבים נוספו לרשימת הקניות');break}
    case 'serv':{const r=bySlug(a.dataset.s);S.servings[r.slug]=Math.max(1,(S.servings[r.slug]||r.serv)+ +a.dataset.d);render();break}
    case 'print':window.print();break;
    case 'share':{const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('הקישור הועתק')).catch(()=>toast('קישור לשיתוף: '+u));break}
    case 'step':step(+a.dataset.d);break;
    case 'timer':{const c=S.cook;if(c.run){clearInterval(timerIv);timerIv=null;c.run=false;a.textContent='הפעל'}else{if(c.left<=0)return;c.run=true;a.textContent='השהה';timerIv=setInterval(()=>{c.left--;const t=$('#tm');if(t)t.textContent=String(Math.floor(c.left/60)).padStart(2,'0')+':'+String(c.left%60).padStart(2,'0');if(c.left<=0){clearInterval(timerIv);timerIv=null;c.run=false;beep();toast('הטיימר הסתיים');render()}},1000)}break}
    case 'timer-reset':{const r=bySlug(S.cook.slug);clearInterval(timerIv);timerIv=null;S.cook.left=r.steps[S.cook.i][1];S.cook.run=false;render();break}
    case 'gmode':S.gen.mode=a.dataset.m;S.gen.result=null;render();break;
    case 'ing-rm':S.gen.ings.splice(+a.dataset.i,1);render();break;
    case 'gen':case 'gen-again':{
      const quota=S.role==='guest'?S.settings.qGuest:S.settings.qUser;
      if(S.used>=quota){toast('הגעתם למכסת היצירות היומית');break}
      if(act==='gen-again')S.gen.variant++;
      const res=mockGen();S.used++;
      const out=$('#genout');out.innerHTML='<div class="stream" id="st"></div>';
      const lines=['מפענח את הבקשה…',`מצב: ${({ingredients:'מהרכיבים',free:'תיאור חופשי',adapt:'התאמת מתכון'})[S.gen.mode]}`,`כותרת: ${res.title}`,...res.ings.map(i=>`• ${i[0]} – ${fmt(i[1])} ${i[2]}`),...res.steps.map((s,i)=>`${i+1}. ${s}`),'בודק ערבוב בשר וחלב…','ולידציה מול JSON Schema… תקין'];
      let i=0;const iv=setInterval(()=>{const st=$('#st');if(!st){clearInterval(iv);return}st.textContent+=lines[i]+'\n';i++;if(i>=lines.length){clearInterval(iv);setTimeout(()=>{S.gen.result=res;const o=$('#genout');if(o){o.innerHTML=resultCard(res);const q=document.querySelector('#gengrid .small.muted');if(q)q.textContent=`נותרו ${Math.max(quota-S.used,0)} מתוך ${quota} יצירות היום`}},350)}},140);
      break}
    case 'gen-save':if(!isUser()){toast('יש להתחבר כדי לשמור מתכונים');setTimeout(()=>location.hash='#/login',900)}else toast('המתכון נשמר לאוסף האישי (טיוטה)');break;
    case 'shop-rm':e.preventDefault();S.shop.splice(+a.dataset.i,1);render();break;
    case 'clear-shop':if(confirm('לנקות את כל רשימת הקניות?')){S.shop=[];render()}break;
    case 'copy-shop':{const t=S.shop.filter(i=>!i.done).map(i=>`${i.n} – ${fmt(i.q)} ${i.u}`).join('\n');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('הרשימה הועתקה')).catch(()=>alert(t));break}
    case 'toggle-hide':{const r=bySlug(a.dataset.s);r.status=r.status==='hidden'?'published':'hidden';render();toast(r.status==='hidden'?'המתכון הוסתר':'המתכון מוצג');break}
    case 'add-row':{const box=$('#'+a.dataset.t);const last=box.lastElementChild.cloneNode(true);last.querySelectorAll('input,textarea').forEach(x=>{x.value=x.type==='number'?(a.dataset.t==='ingrows'?1:0):''});box.appendChild(last);break}
    case 'del-row':{const box=a.closest('[id$=rows]');if(box.children.length>1)a.parentElement.remove();break}
    case 'imgtab':document.querySelectorAll('[data-act=imgtab]').forEach(b=>b.classList.toggle('on',b===a));$('#img-up').hidden=a.dataset.t!=='up';$('#img-gen').hidden=a.dataset.t!=='gen';break;
    case 'enhance':{const src=$('#orig').dataset.src;if(!src){toast('העלו קודם תמונה');break}$('#proc').textContent='מעבד…';setTimeout(()=>{$('#proc').innerHTML=`<img class="enhanced" src="${src}" alt="תמונה מעובדת">`;toast('התמונה עובדה – נא לאשר')},1200);break}
    case 'genimg':{$('#genbox').textContent='יוצר תמונה…';setTimeout(()=>{$('#genbox').innerHTML=art({hue:30},'').replace('class="art ','class="art wide ');toast('התמונה נוצרה (תצוגת דמה) – נא לאשר')},1300);break}
    case 'save-draft':toast('נשמר כטיוטה');break;
    case 'u-toggle':{const u=S.users[+a.dataset.i];u.active=!u.active;render();break}
    case 'u-reset':toast('נוצרה סיסמה זמנית חדשה');break;
    case 'u-del':if(confirm('למחוק את המשתמש?')){S.users.splice(+a.dataset.i,1);render()}break;
    case 'chat-toggle':{const c=$('#chat');c.classList.toggle('open');if(c.classList.contains('open')){if(!$('#msgs').children.length)bot('שלום! ספרו לי מה בא לכם לבשל, ואמצא מתכון מתאים מהאתר.');c.querySelector('input').focus()}break}
  }
});
document.addEventListener('change',e=>{
  const a=e.target;
  if(a.dataset.act==='set-filter'){const q=new URLSearchParams((location.hash.split('?')[1])||'');a.value?q.set(a.dataset.k,a.value):q.delete(a.dataset.k);q.set('x','1');location.hash='#/search?'+q.toString()}
  if(a.dataset.act==='shop-check'){S.shop[+a.dataset.i].done=a.checked;render()}
});
document.addEventListener('input',e=>{
  const a=e.target;
  if(a.dataset.act==='w'){$('#v-'+a.name).textContent=a.value;wsum()}
  if(a.classList.contains('ac')){clearTimeout(a._t);a._t=setTimeout(()=>suggest(a),200)}
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))document.querySelectorAll('.ac-list').forEach(l=>l.hidden=true)});
function suggest(inp){
  const v=inp.value.trim(),box=inp.parentElement.querySelector('.ac-list');
  if(v.length<1){box.hidden=true;return}
  const out=[];
  pub().filter(r=>r.title.includes(v)).forEach(r=>out.push([`#/recipe/${r.slug}`,r.title,'מתכון']));
  Object.keys(ING).filter(n=>n.includes(v)).forEach(n=>out.push([`#/search?w=${encodeURIComponent(n)}`,n,'רכיב']));
  DISH.filter(d=>d.includes(v)).forEach(d=>out.push([`#/search?d=${d}`,d,'סוג מנה']));
  Object.entries(K).filter(([,l])=>l.includes(v)).forEach(([k,l])=>out.push([`#/search?k=${k}`,l,'סוג']));
  box.innerHTML=out.slice(0,8).map(([h,t,c])=>`<a href="${h}"><span>${esc(t)}</span><span class="small muted">${c}</span></a>`).join('');
  box.hidden=!out.length;
}
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  switch(f.dataset.form){
    case 'search':{const t=f.q.value.trim();const p=parseQuery(t);const q=new URLSearchParams({q:t,...p,x:'1'});location.hash='#/search?'+q.toString();break}
    case 'login':S.role='user';$('#role').value='user';toast('התחברתם בהצלחה');location.hash='#/home';break;
    case 'recipe':toast('המתכון פורסם');setTimeout(()=>location.hash='#/admin',700);break;
    case 'new-cm':S.users.push({name:f.n.value,email:f.e.value,role:'content_manager',active:true});toast('חשבון מנהל תוכן נוצר');render();break;
    case 'settings':['qGuest','qUser','rate','wSim','wTime','wPop'].forEach(k=>S.settings[k]=+f[k].value);toast('ההגדרות נשמרו');break;
    case 'chat':{const m=f.m.value.trim();if(!m)return;f.m.value='';me(m);setTimeout(()=>reply(m),500);break}
  }
});
$('#role').addEventListener('change',e=>{S.role=e.target.value;render();toast('תפקיד מודגם: '+e.target.selectedOptions[0].text)});

/* ===================== צ'אט עוזר (מדומה) ===================== */
function me(t){$('#msgs').insertAdjacentHTML('beforeend',`<div class="msg me">${esc(t)}</div>`);scrollChat()}
function bot(h){$('#msgs').insertAdjacentHTML('beforeend',`<div class="msg bot">${h}</div>`);scrollChat()}
function scrollChat(){const m=$('#msgs');m.scrollTop=m.scrollHeight}
function reply(m){
  const p=parseQuery(m);
  if(!Object.keys(p).length&&!S.chatAsked&&m.split(/\s+/).length<3){S.chatAsked=true;bot('כדי לדייק: לאיזו ארוחה – בוקר, צהריים או ערב? ויש העדפה לבשרי, חלבי או פרווה?');return}
  let res=filterR(p);
  if(/בוקר/.test(m))res=res.filter(r=>r.tt.includes('בוקר'));
  else if(/צהריים/.test(m))res=res.filter(r=>r.tt.includes('צהריים'));
  else if(/ערב/.test(m))res=res.filter(r=>r.tt.includes('ערב'));
  res=res.slice(0,3);
  if(!res.length){bot(`לא מצאתי מתכון מתאים באתר.<br><a class="btn sm ai" style="margin-top:8px" href="#/generate?mode=free&text=${encodeURIComponent(m)}">צור לי מתכון חדש</a>`);return}
  bot(`${res.length===1?'מצאתי מתכון אחד מתאים':'מצאתי '+res.length+' מתכונים מתאימים'}:`+res.map(r=>`<a class="mini" href="#/recipe/${r.slug}">${art(r)}<span><b>${esc(r.title)}</b><br><span class="small muted">${K[r.k]} · ${mins(r.prep+r.cook)}</span></span></a>`).join(''));
}

window.addEventListener('hashchange',render);
if(!location.hash)location.hash='#/home';else render();
</script>
</body>
