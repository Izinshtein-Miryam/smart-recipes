name: Add to project

on:
  issues:
    types: [opened, reopened, transferred]
  pull_request:
    types: [opened, reopened]

jobs:
  add:
    if: ${{ vars.PROJECT_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}
